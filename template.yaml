AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UK Financial Products Comparison Platform

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        CACHE_BUCKET_NAME: !Ref CacheBucket

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
  ExchangeRatesApiKey:
    Type: String
    NoEcho: true

Resources:
  FinancialApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/index.handler
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
          EXCHANGE_RATES_API_KEY: !Ref ExchangeRatesApiKey
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CacheBucket
      Events:
        ProductsApi:
          Type: Api
          Properties:
            Path: /products/{category}
            Method: GET
        CompareApi:
          Type: Api
          Properties:
            Path: /compare
            Method: POST
        RecommendationsApi:
          Type: Api
          Properties:
            Path: /recommendations
            Method: GET
        OptionsProducts:
          Type: Api
          Properties:
            Path: /products/{category}
            Method: OPTIONS
        OptionsCompare:
          Type: Api
          Properties:
            Path: /compare
            Method: OPTIONS
        OptionsRecommendations:
          Type: Api
          Properties:
            Path: /recommendations
            Method: OPTIONS
        ExtractFieldsApi:
          Type: Api
          Properties:
            Path: /extract-fields
            Method: GET
        OptionsExtractFields:
          Type: Api
          Properties:
            Path: /extract-fields
            Method: OPTIONS

  CacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldCache
            Status: Enabled
            ExpirationInDays: 7

  FrontendBucket:
    Type: AWS::S3::Bucket

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Enabled: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  CloudFrontUrl:
    Description: Frontend URL
    Value: !GetAtt CloudFrontDistribution.DomainName
  FrontendBucketName:
    Description: S3 bucket for frontend
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID for cache invalidation
    Value: !Ref CloudFrontDistribution
